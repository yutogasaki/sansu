<h1 data-portal-item="item-26e7000b6be23e1a03cb">初回設定の学習範囲</h1>
<p data-portal-item="item-4f9a6bbb317563af4ba1">九九より先のわり算・小数・分数・割合・速さを追加。学年と全12択をスクロールでき、選択した範囲に応じて開始します。</p>
<p data-portal-item="item-6d9d7f4340bd84f38f29">DEVの実操作記録です。390×844、768×1024、390×640で初回・追加・通常版の一覧と保存を確認。公開build・子どもの理解や学習効果の受入ではありません。島の設定面候補は island-touch-first-v1。</p>
