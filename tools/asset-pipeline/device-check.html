<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>島の実機計測</title>
<style>body{margin:0;background:#f5f4ed;color:#203b38;font:14px system-ui}header{padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{width:150px}button,input{font:inherit;padding:8px;border:1px solid #9caaa4;border-radius:8px}button{background:#24574e;color:white}iframe{width:100%;height:calc(100dvh - 112px);border:0;background:white}#status{margin:0 12px 6px}textarea{width:95%;height:160px;margin:8px}</style>
<header><label>機種 <input id="model" placeholder="例：iPhone 15"></label><button id="start" disabled>20秒計測</button><button id="save" disabled>結果を保存</button></header>
<p id="status">島を開いてください。計測中は島を回転・拡大して操作します。</p><iframe title="検証用の島"></iframe><textarea id="result" hidden readonly aria-label="計測結果"></textarea>
<script type="module">
const frame=document.querySelector('iframe'),status=document.querySelector('#status'),start=document.querySelector('#start'),save=document.querySelector('#save'),result=document.querySelector('#result');let report,running=false;
if(isSecureContext)frame.src='./';else status.textContent='この接続では計測できません。HTTPS、またはUSBによるlocalhost接続が必要です。';
const world=()=>frame.contentDocument?.querySelector('.life-world[data-rendered="true"]');
setInterval(()=>{if(!running)start.disabled=!world();},500);
start.onclick=async()=>{
 if(!world())return;running=true;start.disabled=true;save.disabled=true;result.hidden=true;
 const win=frame.contentWindow,canvas=world().querySelector('canvas'),gl=canvas.getContext('webgl2'),ext=gl.getExtension('WEBGL_debug_renderer_info');
 const version=await fetch('./version.json').then(r=>r.json());
 const samples=[],counts=[];let previous=performance.now(),began=previous;
 await new Promise(resolve=>{function tick(now){if(now-began>20000){resolve();return;}if(now-began>1000)samples.push(now-previous);previous=now;status.textContent=`残り ${Math.ceil((20000-now+began)/1000)} 秒：島を回転・拡大して操作してください`;const n=world();if(n&&samples.length%30===0)counts.push({at:now-began,render:JSON.parse(n.dataset.lifeRender||'{}'),assets:JSON.parse(n.dataset.runtimeAssets?.startsWith('{')?n.dataset.runtimeAssets:'{}')});requestAnimationFrame(tick);}requestAnimationFrame(tick);});
 samples.sort((a,b)=>a-b);
 report={date:new Date().toISOString(),model:document.querySelector('#model').value,userAgent:navigator.userAgent,hardwareConcurrency:navigator.hardwareConcurrency,deviceMemory:navigator.deviceMemory,secureContext:isSecureContext,version,target:location.href,viewport:{width:frame.clientWidth,height:frame.clientHeight,dpr:devicePixelRatio},renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),conditions:'20 seconds of manual interaction; first second excluded; browser RAF intervals, not GPU-only duration; embedded viewport; no automatic hardware classification',sampleCount:samples.length,frameMedianMs:samples[Math.floor(samples.length*.5)],frameP95Ms:samples[Math.floor(samples.length*.95)],counts,assets:win.performance.getEntriesByType('resource').filter(r=>/\.glb(?:\?|$)/.test(r.name)).map(r=>({url:r.name,transferBytes:r.transferSize,encodedBytes:r.encodedBodySize,durationMs:r.duration}))};
 result.value=JSON.stringify(report,null,2);result.hidden=false;status.textContent='計測完了。結果を保存して、この会話に添付してください。';save.disabled=false;running=false;
};
save.onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=url;a.download='island-device-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></html>
