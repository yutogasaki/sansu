<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ぽこもこと不思議な島</title>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#f8f7f2">
    <meta name="description" content="といて、ほって、みつけよう。算数が地底探検になる子ども向けゲーム。">
    <link rel="manifest" href="%BASE_URL%manifest.json">

    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ぽこもこ">
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32.png">
  </head>
  <body>
    <div id="root">
      <div id="app-boot" data-loading-candidate="poko-loading-v1" role="status" aria-live="polite">
        <div class="boot-ring" aria-hidden="true"><span>✦</span></div>
        <p id="boot-message">ぽこもこを ひらいているよ…</p>
        <p id="boot-slow" hidden>すこし じかんが かかっているよ</p>
        <button id="boot-retry" type="button" hidden>もういちど ひらく</button>
        <noscript>ブラウザーの JavaScript を有効にして、もういちど ひらいてね。</noscript>
      </div>
    </div>
    <style>
      #app-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; background: #f8f7f2; color: #30364f; font: 700 16px/1.6 system-ui, sans-serif; text-align: center; }
      #app-boot p { margin: 0; } #app-boot [hidden] { display: none; }
      #app-boot .boot-ring { display: grid; place-items: center; width: 80px; height: 80px; border: 3px solid #daddec; border-top-color: #315fb5; border-radius: 50%; }
      #app-boot .boot-ring span { color: #315fb5; font-size: 32px; }
      #boot-slow { color: #606980; font-size: 13px; font-weight: 400; }
      #boot-retry { min-height: 44px; border: 1px solid #315fb5; border-radius: 14px; padding: 10px 18px; background: #fffdf9; color: #30364f; font: inherit; cursor: pointer; }
      #boot-retry:focus-visible { outline: 3px solid #315fb5; outline-offset: 3px; }
    </style>
    <script>
      // This shell paints even while the application bundle is still in flight.
      (() => {
        const boot = document.getElementById('app-boot');
        const retry = document.getElementById('boot-retry');
        retry.addEventListener('click', () => location.reload());
        setTimeout(() => {
          if (!boot.isConnected) return;
          document.getElementById('boot-slow').hidden = false;
          retry.hidden = false;
        }, 12000);
        window.addEventListener('error', event => {
          if (!boot.isConnected || !(event instanceof ErrorEvent || event.target?.tagName === 'SCRIPT')) return;
          document.getElementById('boot-message').textContent = 'うまく ひらけなかったよ';
          retry.hidden = false;
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
