<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><title>作り方を変えて、島を試す</title></head><body data-candidate="terrain-method-trial" data-delivery="standalone-study-only"><header><p>ぽこもこの島 · 制作方法の実験</p><h1>作り方を変えて、島を試す。</h1><p>同じ材料で7つの作り方と6つの条件を比較。自由に掘って、歩けるか確かめられます。</p></header><main><section class="controls"><label>作り方<select id="method"></select></label><label>条件<select id="fixture"></select></label><label><input type="checkbox" id="neutral">地形だけを見る</label></section><section id="stage"><canvas tabindex="0" aria-label="島。矢印で選び、Enterで編集"></canvas><div class="views"><button data-camera="overview">全体</button><button data-camera="near">近く</button></div><p id="loading">同じ家と木を読み込んでいます…</p><span id="badge"></span></section><p id="reaction" role="status" aria-live="polite">岸を掘る・盛る・歩くを試してみよう。</p><section class="controls"><button data-action="dig">湾を掘る</button><button data-action="grow">岬を盛る</button><button data-action="cut">細い陸を切る</button><button id="water">岸へ歩く</button><button id="edge">細い陸の先へ</button><button id="home">家へ戻る</button></section><section class="controls"><button data-tool="lower" aria-pressed="true">掘る</button><button data-tool="raise" aria-pressed="false">盛る</button><button data-tool="view" aria-pressed="false">回して見る</button><button id="undo">戻す</button><button id="redo">やり直す</button><button id="reset">はじめから</button></section><p class="hint">島を押すか、矢印＋Enterで自由に編集。条件・方式の変更は比較用の切り替えです。</p><details><summary>この試作の計測</summary><pre id="facts"></pre></details><section class="reference"><h2>目標と比べる</h2><img src="../2026-10-10-island-final-3d/whole-island-render.png" alt="承認済み全島参考レンダー"><p>厚み・高低差・重なり・場所のまとまりを比較します。全島の物量を小さな試作に求めません。</p></section></main><footer>研究用の独立試作。保存・学習・公開版には接続していません。<a href="README.md">結果と未達</a></footer><script type="module" src="viewer.bundle.js"></script></body></html>
