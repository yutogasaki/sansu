<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不思議な島｜4方向比較</title><style>body{margin:0;background:#f4f1e9;color:#233237;font:15px system-ui,sans-serif}header{padding:24px 28px 10px}h1{font-size:24px;margin:0 0 10px}p{line-height:1.7}.grid{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;padding:16px 28px 30px;overflow:auto}article{min-width:0}img{width:100%;display:block;border-radius:8px}h2{font-size:17px;margin:0 0 8px}.note{color:#607078;font-size:13px}a{color:inherit}</style><header><h1>不思議な島 — 静止画の4方向</h1><p>光・素材・尺度・奥行きの比較。画像生成による未採用コンセプト。実アプリ画面ではありません。</p></header><main class="grid"><article><h2>A｜木陰に光が宿る庭</h2><a href="a-canopy-light.png"><img src="a-canopy-light.png" alt="A｜木陰に光が宿る庭"></a><p>既存の明るさとの連続性が高い。神秘性より豊かな庭の印象が強い。</p></article><article><h2>B｜乳白色の水と光</h2><a href="b-opal-water.png"><img src="b-opal-water.png" alt="B｜乳白色の水と光"></a><p>透明感と夢のような美しさ。隠れた奥は少なく、リゾート感も残る。</p></article><article><h2>C｜巨大植物に抱かれる家</h2><a href="c-botanical-architecture.png"><img src="c-botanical-architecture.png" alt="C｜巨大植物に抱かれる家"></a><p>巨大な枝と葉で空間そのものが幻想的。前景の葉と樹冠が画面を大きく占める。</p></article><article><h2>D｜薄明のひみつの庭</h2><a href="d-twilight-secret.png"><img src="d-twilight-secret.png" alt="D｜薄明のひみつの庭"></a><p>今回のミステリアスさは最も強い。内側の光・深い陰・暖かい家が効く。暗さと顔の読みやすさは要調整。</p></article></main></html>
