<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぽこもこ｜水玉の色使い</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ee;color:#30364f;font:15px/1.8 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:32px 24px}h1{font-size:26px;margin:0}h2{font-size:19px;margin:0 0 4px}header{display:flex;align-items:center;gap:16px;margin-bottom:32px}header img{width:64px;border-radius:20px}p{margin:0 0 20px}header p{margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article p{font-size:13px;min-height:34px}article img{display:block;width:100%;border:1px solid #d1cbd8;border-radius:20px}details{margin-top:14px}details img{margin-top:16px}.note{font-size:13px;margin-top:28px;color:#606980}a{color:#315fb5}@media(max-width:650px){.grid{grid-template-columns:1fr;max-width:390px;margin:auto}}</style><main><header><img src="../../brand/pokomoko-icon-master.png" alt="ぽこもこのくま"><div><h1>水玉の色使い</h1><p>シンプルな水玉と色の組み合わせで、不思議な雰囲気を。</p></div></header><div class="grid"><article><h2>A｜深い青緑 × 琥珀</h2><p>少し夜の気配がある、不思議な配色。</p><a href="previews/phone-a-teal-amber.png"><img src="previews/phone-a-teal-amber.png" alt="A｜深い青緑 × 琥珀の設定画面"></a><details><summary>タブレットを見る</summary><a href="previews/tablet-a-teal-amber.png"><img src="previews/tablet-a-teal-amber.png" alt="A｜深い青緑 × 琥珀のタブレット画面"></a></details></article><article><h2>B｜生成り × 葡萄</h2><p>濃い水玉を効かせた、明るい配色。</p><a href="previews/phone-b-ivory-grape.png"><img src="previews/phone-b-ivory-grape.png" alt="B｜生成り × 葡萄の設定画面"></a><details><summary>タブレットを見る</summary><a href="previews/tablet-b-ivory-grape.png"><img src="previews/tablet-b-ivory-grape.png" alt="B｜生成り × 葡萄のタブレット画面"></a></details></article><article><h2>C｜葡萄 × 珊瑚</h2><p>紫と温かい色が混じる、夢っぽい配色。</p><a href="previews/phone-c-grape-coral.png"><img src="previews/phone-c-grape-coral.png" alt="C｜葡萄 × 珊瑚の設定画面"></a><details><summary>タブレットを見る</summary><a href="previews/tablet-c-grape-coral.png"><img src="previews/tablet-c-grape-coral.png" alt="C｜葡萄 × 珊瑚のタブレット画面"></a></details></article></div><p class="note">水玉の大きさと配置をそろえた、色だけの比較です。Aをローカルの試作へ反映しました。B・Cは配色の比較用です。<br><a href="direction.md">今回の方向</a> · <a href="verification.md">確認した範囲</a></p></main></html>
