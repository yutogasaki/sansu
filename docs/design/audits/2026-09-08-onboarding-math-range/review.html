<h1>初回設定の学習範囲</h1>
<p>九九より先のわり算・小数・分数・割合・速さを追加。学年と全12択をスクロールでき、選択した範囲に応じて開始します。</p>
<p>DEVの実操作記録です。390×844、768×1024、390×640で初回・追加・通常版の一覧と保存を確認。公開build・子どもの理解や学習効果の受入ではありません。島の設定面候補は island-touch-first-v1。</p>
<p><a href="README.md">検証記録</a> · <a href="report.json">初回と追加</a> · <a href="advanced-report.json">範囲別の開始</a> · <a href="classic-report.json">通常版</a></p>
