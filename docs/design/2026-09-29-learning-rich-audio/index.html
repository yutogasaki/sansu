<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ぽこもこの音・聴き比べ</title><style>body{margin:0;background:#fffcf3;color:#141942;font:18px/1.8 system-ui,sans-serif}main{max-width:660px;margin:8vh auto;padding:24px}h1{font-size:30px;line-height:1.4}section{background:white;border:2px solid #141942;border-radius:24px;padding:24px;margin:24px 0;box-shadow:0 5px #141942}audio{width:100%}h2{font-size:22px;margin:0 0 12px}p{margin:10px 0}.muted{color:#62677c;font-size:15px}a{color:#245cf4}</style><main><h1>ぽこもこの音を、もっと楽しく。</h1><p>同じ16秒の入力・正解・連続正解・区間クリアで聴き比べ。</p><section><h2>新しい音</h2><audio controls preload="none" src="after.wav"></audio><p>弾む木琴、丸いベース、鈴と和音。後半で旋律が変わり、短い残響が広がります。</p></section><section><h2>これまでの音</h2><audio controls preload="none" src="before.wav"></audio></section><p class="muted">本体と同じ音源生成コードを使った試聴用ミックスです。16秒間で編成を増やしています。本体では学習の進行に合わせて変わります。</p><p><a href="/#/island?learn=1">アプリでためす →</a></p></main><script>document.querySelectorAll('audio').forEach(a=>a.addEventListener('play',()=>document.querySelectorAll('audio').forEach(b=>{if(a!==b)b.pause()})))</script></html>
