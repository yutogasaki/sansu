<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>同じ家・木から変わる島</title><style>body{margin:0;background:#f5f7fa;color:#25334b;font:16px/1.7 system-ui}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:26px}p{max-width:900px}section{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}figure{margin:0;background:#fff;border:1px solid #e0e5eb;border-radius:12px;overflow:hidden}img{display:block;width:100%}figcaption{padding:14px}a{color:#32558b}.pair{grid-template-columns:repeat(2,minmax(0,1fr))}.large{max-width:900px;margin:26px auto}@media(max-width:700px){section,.pair{grid-template-columns:1fr}main{padding:16px}}</style><main><h1>同じ家1軒・木6本で、岸を変える</h1><p>同じ初期地形、同じ所有物・位置・大きさ・カメラから、実際に掘る・盛る操作を再生。編集に合わせて歩ける地面と経路も変わります。</p><p><a href="index.html">触って確かめる →</a>　<a href="detail-review.md">細部の修正・検証記録</a></p><h2>岸の仕上げを近景で比べる</h2><section class="pair"><figure><img src="evidence/detail/before-near.jpg" alt="修正前の岸。土壁の縦筋が見える"><figcaption>修正前：土壁の縦筋、均一な草縁と砂浜。revision 5c5ed935e657af07</figcaption></figure><figure><img src="evidence/detail/final/cove-near.jpg" alt="修正後の岸。陰影を連続させ草と土の質感を分けた"><figcaption>修正後：三角形の大きさに左右されない陰影、素材ごとの細かな質感、幅に変化のある砂浜。revision 1dfbf01cee89df92</figcaption></figure></section><h2>同じ所有物で3つの地形</h2><section><figure><img src="evidence/detail/final/flat-overview.jpg" alt="平地の同じ家と木"><figcaption><b>平地</b><br>家前から開けた岸へ。比較の出発点。</figcaption></figure><figure><img src="evidence/detail/final/ell-overview.jpg" alt="同じ家と木を残したL字の岸"><figcaption><b>L字の岸</b><br>北の丘と、掘って開いた東の水面。</figcaption></figure><figure><img src="evidence/detail/final/cove-overview.jpg" alt="同じ家と木を残した入り江"><figcaption><b>入り江</b><br>家と木陰に近い場所まで、水際が入り込む。</figcaption></figure></section><figure class="large"><img src="evidence/detail/final/cove-near.jpg" alt="家前と木陰と入り江の近景"><figcaption>実際の近景。物を消したり増やしたりせず、同じ地面で歩いて使う。</figcaption></figure><h2>編集しても、足場と暮らしが続く</h2><section><figure><img src="evidence/detail/final/cut.jpg" alt="歩行中に道を切り、その場で待つ島"><figcaption>道を切ると、その場で待つ。Undoで停止位置から歩き直す。</figcaption></figure><figure><img src="evidence/detail/final/owner-reject.jpg" alt="家の支持を壊す掘削を拒否した実画面"><figcaption>家や木の根元を壊す操作は拒否。元の地形と履歴を保つ。</figcaption></figure><figure><img src="evidence/detail/final/phone-edit.jpg" alt="狭幅で岸を直接掘った実画面" style="max-height:420px;object-fit:contain"><figcaption>狭い画面でも直接編集。Undo/Redoで入力の一致を確認。</figcaption></figure></section><p>候補 lived-terrain / revision 1dfbf01cee89df92 / standalone-study-only。ローカルの制作検証であり、本人保存・通常配布には接続していません。画像だけで子どもの理解や再訪の合格とはしません。</p></main></html>
