<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画面の確認</title><style>body{font-family:system-ui;background:#faf8f1;color:#243747;margin:24px auto;max-width:960px;padding:0 16px}h1{font-size:24px}.pair{display:flex;gap:12px;align-items:flex-start}.pair figure{flex:1;margin:0;min-width:0}.pair img{width:100%;max-height:700px;object-fit:contain}label{display:block;margin:20px 0 6px}textarea{display:block;width:95%;min-height:70px;font:inherit}button,select,input{font:inherit;padding:10px;margin:8px}section{border-top:1px solid #ccc;padding:24px 0}small{display:block}</style><h1>画面の確認</h1><p>説明を聞かずに、左から右へ画面を見てください。正解を当てる必要はありません。見えたままを教えてください。</p><label>回答者の記号（氏名は不要）<input id="observer" placeholder="A〜E"></label><label><input type="checkbox" id="independent">この画面の制作に関わらず、意図した説明をまだ聞いていません</label><label>表示サイズ<select id="width"><option>390</option><option>768</option></select></label><section><h2>セット 1</h2><div class="pair"><figure><img data-id="01" src="390-01-blind.png" alt="画面 01"></figure><figure><img data-id="02" src="390-02-blind.png" alt="画面 02"></figure></div><label>何が変わりましたか。何が起きたと思いますか。<textarea data-key="0-0"></textarea></label><label>その変化は、何をしたために起きたと思いますか。<textarea data-key="0-1"></textarea></label><label>こわい、痛そう、分からないと感じたところはありますか。<textarea data-key="0-2"></textarea></label><label>もう一度やってみたいですか。何を試したいですか。<textarea data-key="0-3"></textarea></label></section><section><h2>セット 2</h2><div class="pair"><figure><img data-id="03" src="390-03-blind.png" alt="画面 03"></figure><figure><img data-id="04" src="390-04-blind.png" alt="画面 04"></figure></div><label>何が変わりましたか。何が起きたと思いますか。<textarea data-key="1-0"></textarea></label><label>その変化は、何をしたために起きたと思いますか。<textarea data-key="1-1"></textarea></label><label>こわい、痛そう、分からないと感じたところはありますか。<textarea data-key="1-2"></textarea></label><label>もう一度やってみたいですか。何を試したいですか。<textarea data-key="1-3"></textarea></label></section><section><h2>セット 3</h2><div class="pair"><figure><img data-id="05" src="390-05-blind.png" alt="画面 05"></figure><figure><img data-id="06" src="390-06-blind.png" alt="画面 06"></figure></div><label>何が変わりましたか。何が起きたと思いますか。<textarea data-key="2-0"></textarea></label><label>その変化は、何をしたために起きたと思いますか。<textarea data-key="2-1"></textarea></label><label>こわい、痛そう、分からないと感じたところはありますか。<textarea data-key="2-2"></textarea></label><label>もう一度やってみたいですか。何を試したいですか。<textarea data-key="2-3"></textarea></label></section><section><h2>セット 4</h2><div class="pair"><figure><img data-id="07" src="390-07-blind.png" alt="画面 07"></figure><figure><img data-id="08" src="390-08-blind.png" alt="画面 08"></figure></div><label>何が変わりましたか。何が起きたと思いますか。<textarea data-key="3-0"></textarea></label><label>その変化は、何をしたために起きたと思いますか。<textarea data-key="3-1"></textarea></label><label>こわい、痛そう、分からないと感じたところはありますか。<textarea data-key="3-2"></textarea></label><label>もう一度やってみたいですか。何を試したいですか。<textarea data-key="3-3"></textarea></label></section><button id="download">回答をファイルに保存</button><small>入力はこのブラウザー内だけで扱います。送信されません。</small><script>document.querySelector('#width').onchange=()=>document.querySelectorAll('img').forEach(img=>img.src=document.querySelector('#width').value+'-'+img.dataset.id+'-blind.png');document.querySelector('#download').onclick=()=>{const result={candidate:'nature-town-acting-s2',observer:document.querySelector('#observer').value,independent:document.querySelector('#independent').checked,width:document.querySelector('#width').value,answers:[...document.querySelectorAll('textarea')].map(t=>({key:t.dataset.key,text:t.value}))};const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='screen-review-response.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};</script></html>
