<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>カニのBlender試作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#26334a;font:16px system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.6}#stage{width:100%;height:min(64vh,650px);background:#d9eaf3;border-radius:20px;overflow:hidden}canvas{display:block;width:100%;height:100%}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button{min-height:44px;padding:10px 18px;border:1px solid #a8b5cb;border-radius:10px;background:white;color:#26334a;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #416be0;outline-offset:3px}button:disabled{opacity:.6;cursor:wait}small{color:#536078}#status{min-height:26px}input{width:100%;min-height:44px}a{color:#3456b4}
</style>
<main><h1>浜辺のカニ</h1><p>気づく → 横歩き → 石の陰へ → 戻る</p><div id="stage" aria-label="浜辺のカニの3D試作"></div>
<div class="controls"><button id="play" disabled>動きをためす</button><button data-frame="1" disabled>待機</button><button data-frame="32" disabled>気づく</button><button data-frame="80" disabled>隠れる</button><button id="view" disabled>近くで見る</button></div>
<label for="timeline">動きの位置</label><input id="timeline" type="range" min="0" max="4.95833" step="0.01" value="0" disabled>
<p id="status" role="status">3Dを読み込んでいます</p><small>crab-mcp-trial-v1 · 独立した制作試作。本体への採用・スマホ実機性能・子どもの理解は未確認。</small><p><a href="crab-trial.blend">Blender原本</a> · <a href="crab-trial.glb">アニメーション付きGLB</a></p></main>
<script type="module" src="viewer.bundle.js"></script></html>
