<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>段丘方式の実験場</title>
<style>
  html, body { margin: 0; height: 100%; background: #b4c7df; font-family: system-ui, sans-serif; color: #2a3350; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: fixed; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; }
  .bar.top { top: 0; left: 0; right: 0; }
  .bar.bottom { bottom: 0; left: 0; right: 0; justify-content: center; }
  button { font: inherit; font-size: 14px; border: 0; border-radius: 999px; padding: 8px 14px; background: #fffdf8e8; color: #2a3350; box-shadow: 0 2px 6px #0002; }
  button.on { background: #2c56a8; color: white; }
  #info { position: fixed; top: 52px; left: 8px; max-width: 420px; background: #fffdf8e0; border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.5; }
  #toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #2a3350; color: white; padding: 8px 14px; border-radius: 999px; font-size: 14px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; }
  body.capture .bar, body.capture #info, body.capture #toast { display: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">native05 の部品を よみこみ中…</div>
<div class="bar top">
  <button data-method="T" class="on">方式T 段丘</button>
  <button data-method="G">方式G 高さ場</button>
  <button data-method="N">参照 native05</button>
  <span style="width:12px"></span>
  <button data-view="whole">全景</button><button data-view="scale">同縮尺</button><button data-view="near">近景</button><button data-view="hill">丘</button>
</div>
<div id="info"></div>
<div id="toast" hidden></div>
<div class="bar bottom">
  <button data-tool="up" class="on">あげる</button><button data-tool="down">さげる</button><button data-tool="move">うごかす</button>
  <button data-action="undo">もどす</button><button data-action="redo">やりなおす</button>
  <button data-action="save">ほぞん</button><button data-action="reset">見本にもどす</button><button data-action="stress">ランダム12回</button>
</div>
<script type="module" src="./lab.bundle.js"></script>
</body>
</html>
