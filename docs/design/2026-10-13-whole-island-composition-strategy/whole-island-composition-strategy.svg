      .micro { font-size: 12px; font-weight: 700; fill: #66738B; letter-spacing: 0.04em; }
      .map-label { font-size: 13px; font-weight: 800; paint-order: stroke; stroke: #F8FAFC; stroke-width: 5px; stroke-linejoin: round; }
      .panel { fill: #FFFFFF; stroke: #D6DEE9; stroke-width: 2; }
      .map { fill: #EAF4F8; stroke: #D3DFEA; stroke-width: 1.5; }
      .land-outline { fill: none; stroke: #202B40; stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; }
      .land-low { fill: #DCE4EF; stroke: #202B40; stroke-width: 5; stroke-linejoin: round; }
      .land-mid { fill: #B8C4DA; }
      .land-high { fill: #8B9BC4; }
      .route-under { fill: none; stroke: #FFFFFF; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .route { fill: none; stroke: #F25573; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .district { fill: none; stroke: #56637A; stroke-width: 2.5; stroke-dasharray: 7 7; }
      .node { fill: #FFFFFF; stroke: #202B40; stroke-width: 3; }
      .gate-pass { fill: #E9EFFB; stroke: #8CA4D8; stroke-width: 1.5; }
      .gate-hold { fill: #FFF0F3; stroke: #EAA0AF; stroke-width: 1.5; }
