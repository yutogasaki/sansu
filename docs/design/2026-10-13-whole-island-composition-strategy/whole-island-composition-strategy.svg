  <!-- Decision framework -->
  <g transform="translate(60 960)">
    <rect width="1110" height="176" rx="24" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="2"/>
    <text x="26" y="35" class="display" font-size="22">判断する順番</text>
    <text x="218" y="35" class="small">点数を足し合わせず、前の門を通った案だけ次へ進める。</text>
    <line x1="365" y1="59" x2="365" y2="153" stroke="#DCE3EC" stroke-width="2"/>
    <line x1="733" y1="59" x2="733" y2="153" stroke="#DCE3EC" stroke-width="2"/>
    <g transform="translate(26 66)">
      <circle cx="18" cy="18" r="18" fill="#18243A"/>
      <text x="18" y="24" class="white" text-anchor="middle" font-size="16" font-weight="850">1</text>
      <text x="51" y="15" class="kicker">輪郭の門</text>
      <text x="51" y="42" class="body">家・色なしで5秒判別</text>
      <text x="51" y="69" class="small">ここで似る案は終了。</text>
    </g>
    <g transform="translate(393 66)">
      <circle cx="18" cy="18" r="18" fill="#315DA8"/>
      <text x="18" y="24" class="white" text-anchor="middle" font-size="16" font-weight="850">2</text>
      <text x="51" y="15" class="kicker">選択の門</text>
      <text x="51" y="42" class="body">置き方で水・食・人流が変化</text>
      <text x="51" y="69" class="small">飾り替えだけなら終了。</text>
    </g>
    <g transform="translate(761 66)">
      <circle cx="18" cy="18" r="18" fill="#F25573"/>
      <text x="18" y="24" class="white" text-anchor="middle" font-size="16" font-weight="850">3</text>
      <text x="51" y="15" class="kicker">移行の門</text>
      <text x="51" y="42" class="body">所有・保存・歩行を壊さない</text>
      <text x="51" y="69" class="small">工数ではなく、実現順を決める。</text>
    </g>
  </g>

  <g transform="translate(1190 960)">
    <rect width="550" height="176" rx="24" fill="#18243A"/>
    <text x="26" y="35" class="blue-light" font-size="14" font-weight="800" letter-spacing="0.12em">推奨する進め方</text>
    <text x="26" y="78" class="display white" font-size="30">本命 C ／ 対抗 A ／ 実験 B</text>
    <text x="26" y="108" class="light" font-size="15" font-weight="650">Cは固有の輪郭・配置の因果・既存水辺資産を同時に残せる。</text>
    <rect x="26" y="126" width="498" height="34" rx="12" fill="#315DA8"/>
    <text x="275" y="148" class="white" text-anchor="middle" font-size="14" font-weight="800">次の一手：Cだけを「開口部・高さ・地区偏り」で3派生する</text>
  </g>

  <text x="60" y="1175" class="micro">SCOPE — 構図の方向決定のみ。コード、Blender、runtime配置、E2E、美術完成、配布は含まない。</text>
  <text x="1740" y="1175" text-anchor="end" class="micro">同一表示枠 = 同一島面積レンジ</text>
</svg>
