    <rect class="panel" width="520" height="740" rx="26" filter="url(#shadow)"/>
    <circle cx="43" cy="43" r="23" fill="#18243A"/>
    <text x="43" y="51" class="white" text-anchor="middle" font-size="22" font-weight="850">C</text>
    <text x="82" y="38" class="panel-title">環状の入り江</text>
    <text x="82" y="63" class="panel-sub">一周が、毎日の暮らしになる</text>
