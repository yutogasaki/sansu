    <text x="366" y="26" class="micro">濃いほど高い</text>
    <rect x="494" y="9" width="116" height="24" rx="12" fill="#18243A"/>
    <text x="552" y="26" class="white" text-anchor="middle" font-size="11" font-weight="800">64pxでも判別</text>
  </g>

