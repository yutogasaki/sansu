    <g transform="translate(24 459)">
      <rect width="82" height="82" rx="18" fill="#F2F4F8" stroke="#D2DBE7"/>
      <path d="M22 60C7 44 13 22 31 13C48 4 68 12 73 28C79 45 67 60 53 66" fill="none" stroke="#18243A" stroke-width="16" stroke-linecap="round"/>
      <text x="41" y="77" text-anchor="middle" font-size="9" font-weight="800" fill="#6A7589">64px</text>
    </g>
    <text x="126" y="481" class="kicker">黒一色でも</text>
    <text x="126" y="508" class="body">中央が抜けた、開いた輪</text>
    <text x="24" y="575" class="kicker">暮らしの主役</text>
