      .gate-text { font-size: 12px; font-weight: 800; letter-spacing: 0.03em; }
      .white { fill: #FFFFFF; }
      .light { fill: #DCE5F2; }
      .blue-light { fill: #AFC2E2; }
    </style>
  </defs>

  <rect width="1800" height="1200" fill="#F3F5F8"/>
  <path d="M0 0H1800V14H0Z" fill="#315DA8"/>

  <text x="60" y="67" class="display" font-size="46">次の全島構図を選ぶための戦略ボード</text>
  <text x="60" y="105" font-size="18" font-weight="600" fill="#59667E">家を動かす前に、島の骨格を選ぶ。3案は同一縮尺・同一視点・同一評価軸。</text>

  <g transform="translate(1428 44)">
    <rect width="312" height="62" rx="18" fill="#18243A"/>
    <text x="22" y="25" class="white" font-size="12" font-weight="800" letter-spacing="0.14em">SOURCE STRATEGY</text>
    <text x="22" y="47" class="light" font-size="13" font-weight="650">runtime未実装 · 2026-10-13</text>
  </g>

  <g transform="translate(60 128)">
    <rect width="500" height="42" rx="14" fill="#FFFFFF" stroke="#D4DCE8"/>
    <text x="18" y="26" class="small"><tspan font-weight="850" fill="#1B263A">固定</tspan><tspan dx="14">8軒の家・住人と家・育った履歴</tspan></text>
  </g>
  <g transform="translate(580 128)">
    <rect width="500" height="42" rx="14" fill="#FFFFFF" stroke="#D4DCE8"/>
    <text x="18" y="26" class="small"><tspan font-weight="850" fill="#1B263A">可変</tspan><tspan dx="14">輪郭・高低差・主動線・地区の隣接</tspan></text>
  </g>
