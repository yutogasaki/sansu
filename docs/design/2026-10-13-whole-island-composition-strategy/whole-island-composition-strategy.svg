    <text x="126" y="508" class="body">水で分かれた、五つのかたまり</text>
    <text x="24" y="575" class="kicker">暮らしの主役</text>
    <text x="24" y="604" class="body">橋を選ぶほど、水辺と地区の関係が変わる。</text>
