<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">次の全島構図を選ぶための戦略ボード</title>
  <desc id="desc">丘の町、水辺の群島、環状の入り江を同じ縮尺と同じ視点で比較し、輪郭、高低差、主要道、地区構成、移行難度を判断するためのボード。</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#C9D4E2" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#18243A" flood-opacity="0.08"/>
    </filter>
    <style>
